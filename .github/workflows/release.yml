name: Release

# Publishes a GitHub Release: builds Windows x64/arm64 and macOS universal
# packages, writes (and signs, if a key is configured) the update manifest
# `latest.json` read by the in-app updater, and creates the tag.
#
# Start it by any of:
#   - pushing a tag like v27.0.1
#   - Actions tab > Release > Run workflow (on main), entering the tag
#   - committing a new tag name to .github/release-request on a branch
#
# Secrets:
#   UPDATE_SIGNING_KEY   base64 Ed25519 private key (cargo run -p cb-update --bin cb-release -- keygen)
#   MACOS_SIGN_IDENTITY  optional Developer ID identity (needs a keychain set up separately)

on:
  push:
    tags: ["v*"]
    branches: ["main", "claude/**"]
    paths: [".github/release-request"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v27.0.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="$(tr -d ' \r\n' < .github/release-request)"
          fi
          case "$TAG" in v[0-9]*) ;; *) echo "::error::bad tag '$TAG'"; exit 1;; esac
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Cargo.toml version $VERSION does not match tag $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            optional: false
          - target: aarch64-pc-windows-msvc
            arch: arm64
            optional: true
    runs-on: windows-latest
    # arm64 is a bonus: a failure there must not block the release.
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - shell: pwsh
        run: ./scripts/package-windows.ps1 -Target ${{ matrix.target }} -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*-setup.exe

  macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package-macos.sh
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.zip

  publish:
    needs: [meta, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          ls -la artifacts
          NOTES=docs/release-notes.md
          [ -f "$NOTES" ] || echo "- 性能与稳定性改进" > "$NOTES"
          ASSETS=()
          for pair in "windows-x64=cloudboard-${VERSION}-windows-x64.zip" "windows-arm64=cloudboard-${VERSION}-windows-arm64.zip" "macos-universal=Cloudboard-${VERSION}-macos-universal.zip"; do
            f="artifacts/${pair#*=}"
            if [ -f "$f" ]; then ASSETS+=(--asset "${pair%%=*}=$f"); else echo "::warning::missing $f"; fi
          done
          cargo run --quiet --release -p cb-update --bin cb-release -- manifest \
            --version "$VERSION" --base-url "$BASE" --notes "$NOTES" "${ASSETS[@]}" > artifacts/latest.json
          cat artifacts/latest.json
          if [ -n "${UPDATE_SIGNING_KEY}" ]; then
            cargo run --quiet --release -p cb-update --bin cb-release -- sign artifacts/latest.json > artifacts/latest.json.sig
          else
            echo "::warning::UPDATE_SIGNING_KEY not set; latest.json is unsigned (clients with an embedded key will reject it)."
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Cloudboard ${{ needs.meta.outputs.tag }}
          body_path: docs/release-notes.md
          make_latest: "true"
          files: |
            artifacts/*.zip
            artifacts/*-setup.exe
            artifacts/latest.json
            artifacts/latest.json.sig
          fail_on_unmatched_files: false

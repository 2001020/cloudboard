<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科学计算器</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<style>
@font-face {
  font-family: 'AnthropicSans';
  src: url('fonts/AnthropicSans-Romans-Variable-25x258.ttf') format('truetype-variations');
  font-weight: 100 900;
  font-display: swap;
}

:root {
  --bg: #f0f5fa; --bg2: #e3eef8; --bg3: #d0e2f4;
  --surface: #ffffff; --surface2: #f5f8fc; --text: #1a2a3a;
  --text2: #4a5a6a; --text3: #7a8a9a; --border: #c8d8e8;
  --primary: #5b9bd5; --primary-hover: #4a8bc5; --primary-light: #d0e4f8;
  --accent: #3b7dbb; --shadow: rgba(26,42,58,0.08);
  --shadow-lg: rgba(26,42,58,0.14); --btn-num: #ffffff;
  --btn-num-hover: #e8f0f8; --btn-op: #e8f0f8; --btn-op-hover: #d8e4f0;
  --btn-func: #dce8f4; --btn-func-hover: #c8d8e8;
  --btn-eq: #5b9bd5; --btn-eq-hover: #4a8bc5; --btn-eq-text: #ffffff;
  --disp-bg: #f8fafc; --error: #d35; --scrollbar: #c0d0e0;
  --scrollbar-hover: #90a8c0; --hist-item-bg: #f5f8fc;
  --hist-item-hover: #e8f0f8; --input-bg: #ffffff; --input-border: #c8d8e8;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a2028; --bg2: #212830; --bg3: #283038;
    --surface: #252d35; --surface2: #2a323a; --text: #e0e8f0;
    --text2: #b0bcc8; --text3: #7a8898; --border: #384450;
    --primary: #6aadd8; --primary-hover: #7abde4; --primary-light: #283848;
    --accent: #5aadd8; --shadow: rgba(0,0,0,0.3);
    --shadow-lg: rgba(0,0,0,0.5); --btn-num: #2a323a;
    --btn-num-hover: #323a44; --btn-op: #303840; --btn-op-hover: #384450;
    --btn-func: #2d353d; --btn-func-hover: #354048;
    --btn-eq: #5b9bd5; --btn-eq-hover: #6aadd8; --btn-eq-text: #fff;
    --disp-bg: #222a32; --error: #f55; --scrollbar: #384450;
    --scrollbar-hover: #485868; --hist-item-bg: #2a323a;
    --hist-item-hover: #323a44; --input-bg: #2a323a; --input-border: #384450;
  }
}

[data-theme="light"] {
  --bg: #f0f5fa; --bg2: #e3eef8; --bg3: #d0e2f4;
  --surface: #ffffff; --surface2: #f5f8fc; --text: #1a2a3a;
  --text2: #4a5a6a; --text3: #7a8a9a; --border: #c8d8e8;
  --primary: #5b9bd5; --primary-hover: #4a8bc5; --primary-light: #d0e4f8;
  --accent: #3b7dbb; --shadow: rgba(26,42,58,0.08);
  --shadow-lg: rgba(26,42,58,0.14); --btn-num: #ffffff;
  --btn-num-hover: #e8f0f8; --btn-op: #e8f0f8; --btn-op-hover: #d8e4f0;
  --btn-func: #dce8f4; --btn-func-hover: #c8d8e8;
  --btn-eq: #5b9bd5; --btn-eq-hover: #4a8bc5; --btn-eq-text: #ffffff;
  --disp-bg: #f8fafc; --error: #d35; --scrollbar: #c0d0e0;
  --scrollbar-hover: #90a8c0; --hist-item-bg: #f5f8fc;
  --hist-item-hover: #e8f0f8; --input-bg: #ffffff; --input-border: #c8d8e8;
}

[data-theme="dark"] {
  --bg: #1a2028; --bg2: #212830; --bg3: #283038;
  --surface: #252d35; --surface2: #2a323a; --text: #e0e8f0;
  --text2: #b0bcc8; --text3: #7a8898; --border: #384450;
  --primary: #6aadd8; --primary-hover: #7abde4; --primary-light: #283848;
  --accent: #5aadd8; --shadow: rgba(0,0,0,0.3);
  --shadow-lg: rgba(0,0,0,0.5); --btn-num: #2a323a;
  --btn-num-hover: #323a44; --btn-op: #303840; --btn-op-hover: #384450;
  --btn-func: #2d353d; --btn-func-hover: #354048;
  --btn-eq: #5b9bd5; --btn-eq-hover: #6aadd8; --btn-eq-text: #fff;
  --disp-bg: #222a32; --error: #f55; --scrollbar: #384450;
  --scrollbar-hover: #485868; --hist-item-bg: #2a323a;
  --hist-item-hover: #323a44; --input-bg: #2a323a; --input-border: #384450;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'AnthropicSans', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: background 0.3s, color 0.3s;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}

.container {
  width: 100%;
  max-width: 760px;
  height: 100vh;
  max-height: 720px;
  display: flex;
  flex-direction: column;
  padding: 10px 14px;
  gap: 6px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px;
  flex-shrink: 0;
}
.title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 0.02em;
}
.header-btns { display: flex; gap: 6px; }

.icon-btn {
  width: 34px; height: 34px;
  border: 1px solid var(--border); border-radius: 9px;
  background: var(--surface); color: var(--text2);
  cursor: pointer; font-size: 0.95rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.icon-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px var(--shadow);
  color: var(--text); border-color: var(--primary);
}

.display {
  background: var(--disp-bg);
  border: 2px solid var(--border);
  border-radius: 15px;
  padding: 12px 18px;
  flex-shrink: 0;
  min-height: 90px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-end;
  transition: border-color 0.25s, background 0.3s;
  word-break: break-all;
  overflow: hidden;
}
.display:focus-within { border-color: var(--primary); }

.expr-line {
  font-size: 1.05rem;
  color: var(--text2);
  min-height: 1.5em;
  text-align: right;
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  line-height: 1.4;
  white-space: nowrap;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}
.expr-line .katex { font-size: 1.05rem; }
.expr-line .katex .mathit { font-family: 'AnthropicSans', serif; }

.result-line {
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--text);
  min-height: 2.4em;
  text-align: right;
  width: 100%;
  overflow-wrap: anywhere;
  line-height: 1.2;
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
}

.keypad-wrap {
  flex: 1;
  display: flex;
  gap: 8px;
  min-height: 0;
}

.keypad {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 5px;
  min-height: 300px;
}

.btn {
  border: 1px solid var(--border);
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  font-family: 'AnthropicSans', 'Microsoft YaHei', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  top: 0;
  min-height: 42px;
  font-size: 0.95rem;
}
.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 16px var(--shadow-lg);
  z-index: 2;
}
.btn:active {
  transform: translateY(0);
  box-shadow: 0 1px 4px var(--shadow);
  transition: all 0.05s;
}

.btn-num { background: var(--btn-num); color: var(--text); }
.btn-num:hover { background: var(--btn-num-hover); }

.btn-op { background: var(--btn-op); color: var(--accent); font-size: 1.1rem; }
.btn-op:hover { background: var(--btn-op-hover); }

.btn-func { background: var(--btn-func); color: var(--text2); font-size: 0.82rem; }
.btn-func:hover { background: var(--btn-func-hover); color: var(--text); }

.btn-eq { background: var(--btn-eq); color: var(--btn-eq-text); font-size: 1.25rem; }
.btn-eq:hover { background: var(--btn-eq-hover); }

.btn-clr { color: var(--error); }

.history-panel {
  width: 230px; flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--border); border-radius: 15px;
  display: flex; flex-direction: column; overflow: hidden;
  transition: all 0.3s;
}
.history-panel.hidden { display: none; }

.hist-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.hist-title { font-size: 0.85rem; font-weight: 700; }
.hist-clear {
  font-size: 0.72rem; color: var(--error);
  background: none; border: none; cursor: pointer;
  padding: 4px 8px; border-radius: 6px;
  font-family: 'AnthropicSans', 'Microsoft YaHei', sans-serif;
  transition: all 0.2s;
}
.hist-clear:hover { background: #fdd; }

.hist-list {
  flex: 1; overflow-y: auto; padding: 6px;
  display: flex; flex-direction: column; gap: 4px;
}
.hist-list::-webkit-scrollbar { width: 4px; }
.hist-list::-webkit-scrollbar-track { background: transparent; }
.hist-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }
.hist-list::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

.hist-empty { text-align: center; color: var(--text3); font-size: 0.78rem; padding: 30px 10px; }

.hist-item {
  background: var(--hist-item-bg); border-radius: 9px;
  padding: 7px 10px; cursor: pointer; transition: all 0.15s;
  position: relative; border: 1px solid transparent;
}
.hist-item:hover { background: var(--hist-item-hover); border-color: var(--border); }
.hist-item-expr {
  font-size: 0.78rem; color: var(--text2);
  word-break: break-all; line-height: 1.3;
}
.hist-item-res {
  font-size: 0.95rem; font-weight: 600; color: var(--text);
  word-break: break-all; line-height: 1.3;
}
.hist-item-del {
  position: absolute; top: 4px; right: 6px;
  width: 20px; height: 20px; border: none; border-radius: 50%;
  background: transparent; color: var(--text3); cursor: pointer;
  font-size: 0.7rem; display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: all 0.15s;
}
.hist-item:hover .hist-item-del { opacity: 1; }
.hist-item-del:hover { background: var(--error); color: #fff; }

/* ---- Mobile ---- */
@media (max-width: 700px) {
  .container { max-height: none; height: 100dvh; padding: 6px 8px; gap: 4px; }
  .history-panel { width: 100%; max-height: 180px; border-radius: 12px; }
  .keypad-wrap { flex-direction: column; }
  .keypad { gap: 4px; min-height: 300px; }
  .btn { border-radius: 10px; min-height: 46px; font-size: 0.9rem; }
  .btn-func { font-size: 0.76rem; }
  .btn-eq { font-size: 1.1rem; }
  .btn-op { font-size: 1rem; }
  .display { padding: 10px 14px; min-height: 100px; border-radius: 13px; }
  .result-line { font-size: 1.8rem; min-height: 2.2em; }
  .expr-line { font-size: 0.95rem; min-height: 1.4em; }
  .title { font-size: 1rem; }
  .icon-btn { width: 32px; height: 32px; border-radius: 8px; }
}

@media (max-width: 420px) {
  .container { padding: 5px 6px; gap: 3px; }
  .keypad { gap: 3px; min-height: 280px; }
  .btn { border-radius: 9px; min-height: 44px; font-size: 0.84rem; }
  .btn-func { font-size: 0.72rem; }
  .display { padding: 8px 12px; min-height: 96px; }
  .result-line { font-size: 1.6rem; }
  .expr-line { font-size: 0.88rem; }
  .hist-item-expr { font-size: 0.72rem; }
  .hist-item-res { font-size: 0.85rem; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="title">科学计算器</span>
    <div class="header-btns">
      <button class="icon-btn" id="btnTheme" title="切换深浅色模式" aria-label="切换深浅色模式">🌓</button>
      <button class="icon-btn" id="btnHistory" title="历史记录" aria-label="历史记录">📋</button>
    </div>
  </div>

  <div class="display" id="display">
    <div class="expr-line" id="exprLine"></div>
    <div class="result-line" id="resultLine">0</div>
  </div>

  <div class="keypad-wrap" id="keypadWrap">
    <div class="keypad" id="keypad">
      <button class="btn btn-clr btn-func" data-action="clear">C</button>
      <button class="btn btn-clr btn-func" data-action="backspace">⌫</button>
      <button class="btn btn-func" data-action="percent">%</button>
      <button class="btn btn-op" data-action="operator" data-value="/">÷</button>
      <button class="btn btn-func" data-action="function" data-value="sin">sin</button>
      <button class="btn btn-func" data-action="function" data-value="cos">cos</button>

      <button class="btn btn-num" data-action="digit" data-value="7">7</button>
      <button class="btn btn-num" data-action="digit" data-value="8">8</button>
      <button class="btn btn-num" data-action="digit" data-value="9">9</button>
      <button class="btn btn-op" data-action="operator" data-value="*">×</button>
      <button class="btn btn-func" data-action="function" data-value="tan">tan</button>
      <button class="btn btn-func" data-action="function" data-value="log">log</button>

      <button class="btn btn-num" data-action="digit" data-value="4">4</button>
      <button class="btn btn-num" data-action="digit" data-value="5">5</button>
      <button class="btn btn-num" data-action="digit" data-value="6">6</button>
      <button class="btn btn-op" data-action="operator" data-value="-">−</button>
      <button class="btn btn-func" data-action="function" data-value="ln">ln</button>
      <button class="btn btn-func" data-action="function" data-value="sqrt">√</button>

      <button class="btn btn-num" data-action="digit" data-value="1">1</button>
      <button class="btn btn-num" data-action="digit" data-value="2">2</button>
      <button class="btn btn-num" data-action="digit" data-value="3">3</button>
      <button class="btn btn-op" data-action="operator" data-value="+">+</button>
      <button class="btn btn-func" data-action="function" data-value="square">x²</button>
      <button class="btn btn-func" data-action="function" data-value="power">xʸ</button>

      <button class="btn btn-num" data-action="digit" data-value="0">0</button>
      <button class="btn btn-num" data-action="decimal">.</button>
      <button class="btn btn-func" data-action="negate">±</button>
      <button class="btn btn-func" data-action="ans">ANS</button>
      <button class="btn btn-func" data-action="arrow" data-value="left">←</button>
      <button class="btn btn-func" data-action="arrow" data-value="right">→</button>

      <button class="btn btn-func" data-action="paren" data-value="(">(</button>
      <button class="btn btn-func" data-action="paren" data-value=")">)</button>
      <button class="btn btn-func" data-action="constant" data-value="pi">π</button>
      <button class="btn btn-func" data-action="constant" data-value="e">e</button>
      <button class="btn btn-func btn-frac" data-action="fraction">⅟</button>
      <button class="btn btn-eq" data-action="equals">=</button>
    </div>

    <div class="history-panel" id="historyPanel">
      <div class="hist-header">
        <span class="hist-title">历史记录</span>
        <button class="hist-clear" id="histClear">全部清除</button>
      </div>
      <div class="hist-list" id="histList">
        <div class="hist-empty">暂无记录</div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
// ======================== MATH ENGINE ========================
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function toSup(n) { return String(n).split('').map(c => SUP[c]||c).join(''); }

function fact(n) {
  if (!Number.isInteger(n) || n < 0) return NaN;
  if (n > 170) return Infinity;
  let r = 1; for (let i = 2; i <= n; i++) r *= i; return r;
}

function tokenize(expr) {
  const tokens = [];
  let i = 0;
  while (i < expr.length) {
    const ch = expr[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (/\d/.test(ch) || (ch === '.' && i+1 < expr.length && /\d/.test(expr[i+1]))) {
      let num = '';
      while (i < expr.length && (/\d/.test(expr[i]) || expr[i] === '.')) { num += expr[i]; i++; }
      if (i < expr.length && /[eE]/.test(expr[i]) && !/[a-df-zA-DF-Z]/.test(expr[i])) {
        num += expr[i]; i++;
        if (i < expr.length && (expr[i]==='+'||expr[i]==='-')) { num += expr[i]; i++; }
        while (i < expr.length && /\d/.test(expr[i])) { num += expr[i]; i++; }
      }
      tokens.push({t:'num',v:parseFloat(num)});
      continue;
    }
    if (/[a-wyzA-WYZ]/.test(ch)) {
      let name = '';
      while (i < expr.length && /[a-zA-Z]/.test(expr[i])) { name += expr[i]; i++; }
      const fn = name.toLowerCase();
      if (['sin','cos','tan','log','ln','exp','sqrt','abs','asin','acos','atan'].includes(fn)) {
        tokens.push({t:'fn',v:fn});
      } else if (fn === 'pi') { tokens.push({t:'num',v:Math.PI}); }
      else if (fn === 'e') { tokens.push({t:'num',v:Math.E}); }
      else if (fn === 'ans') { tokens.push({t:'ans'}); }
      else { tokens.push({t:'var',v:fn}); }
      continue;
    }
    if (ch === 'x' || ch === 'X') { tokens.push({t:'var',v:'x'}); i++; continue; }
    switch (ch) {
      case '+': tokens.push({t:'op',v:'+'}); break;
      case '−': case '-': tokens.push({t:'op',v:'-'}); break;
      case '×': case '*': tokens.push({t:'op',v:'*'}); break;
      case '÷': case '/': tokens.push({t:'op',v:'/'}); break;
      case '^': tokens.push({t:'op',v:'^'}); break;
      case '!': tokens.push({t:'op',v:'!'}); break;
      case '%': tokens.push({t:'op',v:'/'}); tokens.push({t:'num',v:100}); break;
      case '(': tokens.push({t:'lp'}); break;
      case ')': tokens.push({t:'rp'}); break;
      default: i++; continue;
    }
    i++;
  }
  const out = [];
  for (let j = 0; j < tokens.length; j++) {
    const prev = out[out.length-1], cur = tokens[j];
    if (prev && cur && (prev.t==='num'||prev.t==='rp') && (cur.t==='var'||cur.t==='fn'||cur.t==='lp'))
      out.push({t:'op',v:'*'});
    out.push(cur);
  }
  return out;
}

class Parser {
  constructor(tokens) { this.t = tokens; this.p = 0; }
  peek() { return this.t[this.p]; }
  eat() { return this.t[this.p++]; }
  parse() { return this.expr(); }
  expr() {
    let l = this.term();
    while (this.peek() && this.peek().t==='op' && (this.peek().v==='+'||this.peek().v==='-'))
      l = {t:'bin',op:this.eat().v,left:l,right:this.term()};
    return l;
  }
  term() {
    let l = this.unary();
    while (this.peek() && this.peek().t==='op' && (this.peek().v==='*'||this.peek().v==='/'))
      l = {t:'bin',op:this.eat().v,left:l,right:this.unary()};
    return l;
  }
  unary() {
    if (this.peek() && this.peek().t==='op' && this.peek().v==='-') {
      this.eat(); return {t:'una',op:'-',arg:this.unary()};
    }
    return this.power();
  }
  power() {
    let l = this.factorial();
    if (this.peek() && this.peek().t==='op' && this.peek().v==='^') {
      this.eat(); return {t:'bin',op:'^',left:l,right:this.power()};
    }
    return l;
  }
  factorial() {
    let n = this.primary();
    while (this.peek() && this.peek().t==='op' && this.peek().v==='!') {
      this.eat(); n = {t:'una',op:'!',arg:n};
    }
    return n;
  }
  primary() {
    const tk = this.peek();
    if (!tk) throw new Error('表达式不完整');
    if (tk.t === 'num') { this.eat(); return {t:'num',v:tk.v}; }
    if (tk.t === 'var') { this.eat(); return {t:'var',v:tk.v}; }
    if (tk.t === 'ans') { this.eat(); return {t:'ans'}; }
    if (tk.t === 'fn') {
      this.eat();
      if (!this.peek()||this.peek().t!=='lp') throw new Error(tk.v+' 后需要 (');
      this.eat();
      const arg = this.expr();
      if (!this.peek()||this.peek().t!=='rp') throw new Error(tk.v+' 缺少 )');
      this.eat();
      if (tk.v==='sqrt') return {t:'bin',op:'^',left:arg,right:{t:'num',v:0.5}};
      if (tk.v==='tenpow') return {t:'bin',op:'^',left:{t:'num',v:10},right:arg};
      if (tk.v==='square') return {t:'bin',op:'^',left:arg,right:{t:'num',v:2}};
      if (tk.v==='reciprocal') return {t:'bin',op:'^',left:arg,right:{t:'num',v:-1}};
      if (tk.v==='exp') return {t:'fn',v:'exp',arg};
      return {t:'fn',v:tk.v,arg};
    }
    if (tk.t === 'lp') {
      this.eat(); const e = this.expr();
      if (!this.peek()||this.peek().t!=='rp') throw new Error('缺少 )');
      this.eat(); return e;
    }
    throw new Error('意外的符号: '+JSON.stringify(tk));
  }
}

function evalNode(node, vars, ansVal) {
  if (node.t === 'num') return node.v;
  if (node.t === 'var') {
    if (vars && node.v in vars) return vars[node.v];
    throw new Error('未定义变量: '+node.v);
  }
  if (node.t === 'ans') {
    if (ansVal !== undefined) return ansVal;
    throw new Error('ANS 不可用');
  }
  if (node.t === 'una') {
    const v = evalNode(node.arg, vars, ansVal);
    if (node.op === '-') return -v;
    if (node.op === '!') return fact(v);
  }
  if (node.t === 'bin') {
    const l = evalNode(node.left, vars, ansVal);
    const r = evalNode(node.right, vars, ansVal);
    switch (node.op) {
      case '+': return l + r; case '-': return l - r;
      case '*': return l * r; case '/': return l / r;
      case '^': return Math.pow(l, r);
    }
  }
  if (node.t === 'fn') {
    const arg = evalNode(node.arg, vars, ansVal);
    switch (node.v) {
      case 'sin': return Math.sin(arg);
      case 'cos': return Math.cos(arg);
      case 'tan': return Math.tan(arg);
      case 'asin': return Math.asin(arg);
      case 'acos': return Math.acos(arg);
      case 'atan': return Math.atan(arg);
      case 'log': return Math.log10(arg);
      case 'ln': return Math.log(arg);
      case 'exp': return Math.exp(arg);
      case 'abs': return Math.abs(arg);
    }
  }
  throw new Error('未知节点');
}

function evaluateExpression(exprStr, ansVal) {
  let s = exprStr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').trim();
  if (!s) return null;
  const tokens = tokenize(s);
  const parser = new Parser(tokens);
  const ast = parser.parse();
  return evalNode(ast, null, ansVal);
}

function formatResult(n) {
  if (n === null || n === undefined) return '0';
  if (typeof n !== 'number') return String(n);
  if (!isFinite(n)) return isNaN(n) ? '错误' : (n > 0 ? '∞' : '−∞');
  if (n === 0) return '0';
  const absN = Math.abs(n);
  if (absN >= 1e12 || (absN < 1e-5 && absN > 0)) {
    const exp = Math.floor(Math.log10(absN));
    const mantissa = n / Math.pow(10, exp);
    let mStr = parseFloat(mantissa.toPrecision(12));
    if (Number.isInteger(mStr) && Math.abs(mStr) < 1e15) mStr = mStr.toString();
    else mStr = parseFloat(mStr.toFixed(10)).toString();
    const absM = Math.abs(parseFloat(mStr));
    const mFinal = absM === 1 ? '1' : (absM % 1 === 0 ? String(absM) : parseFloat(absM.toFixed(10)).toString());
    return (n < 0 ? '−' : '') + mFinal + '×10' + toSup(exp);
  }
  if (Number.isInteger(n) && Math.abs(n) < 1e15) return n.toString();
  let str = parseFloat(n.toPrecision(12)).toString();
  if (str.includes('.')) str = str.replace(/0+$/,'').replace(/\.$/,'');
  return str === '' ? '0' : str;
}

// ======================== RADICAL SIMPLIFICATION ========================
function isSimpleSqrt(expr) {
  const s = expr.trim();
  if (!s.startsWith('sqrt(')) return false;
  if (s[s.length - 1] !== ')') return false;
  let depth = 0;
  for (let i = 5; i < s.length - 1; i++) {
    if (s[i] === '(') depth++;
    else if (s[i] === ')') depth--;
    if (depth < 0) return false;
  }
  return depth === 0;
}

function isSimpleNegSqrt(expr) {
  const s = expr.trim();
  if (s.startsWith('-sqrt(')) {
    const inner = s.substring(1);
    return isSimpleSqrt(inner);
  }
  return false;
}

function extractSqrtArg(expr) {
  let s = expr.trim();
  let neg = false;
  if (s.startsWith('-')) { neg = true; s = s.substring(1); }
  return { neg, arg: s.substring(5, s.length - 1).trim() };
}

function simplifyRadical(n) {
  if (!Number.isFinite(n) || n <= 0 || !Number.isInteger(n)) return null;
  if (n === 1) return { a: 1, b: 1 };
  let a = 1, b = n;
  const limit = Math.floor(Math.sqrt(n));
  for (let i = limit; i >= 2; i--) {
    if (n % (i * i) === 0) { a = i; b = n / (i * i); break; }
  }
  return { a, b };
}

function radicalToLatex(neg, a, b) {
  if (b === 1) return (neg ? '-' : '') + String(a);
  let latex = '';
  if (a === 1) latex = '\\sqrt{' + b + '}';
  else latex = a + '\\sqrt{' + b + '}';
  return (neg ? '-' : '') + latex;
}

function radicalFracToLatex(neg, numA, numB, den) {
  // Display: ±(a√b)/c
  let numLatex = numA === 1 && numB === 1 ? '1' : radicalToLatex(false, numA, numB);
  let latex;
  if (den === 1) {
    latex = numLatex;
  } else {
    latex = '\\frac{' + numLatex + '}{' + den + '}';
  }
  return (neg ? '-' : '') + latex;
}

function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while(b){[a,b]=[b,a%b];} return a; }

function isCloseToInteger(n) { return Math.abs(n - Math.round(n)) < 1e-10; }

// Detect if value can be expressed as (a√b)/c
function detectGeneralRadical(value) {
  if (!Number.isFinite(value) || value === 0) return null;
  const neg = value < 0;
  const absV = Math.abs(value);
  const sq = absV * absV;

  // Try sq ≈ p/q for small integers p, q
  for (let q = 1; q <= 200; q++) {
    const p = sq * q;
    const pR = Math.round(p);
    if (Math.abs(p - pR) < 1e-9 && pR > 0 && pR <= 10000) {
      const g = gcd(pR, q);
      const num = pR / g;  // numerator of sq as reduced fraction
      const den = q / g;   // denominator

      const numSimp = simplifyRadical(num);  // √num = a√b
      const denSimp = simplifyRadical(den);  // √den = c√d
      if (!numSimp || !denSimp) continue;

      // absV = √(num/den) = (a√b) / (c√d)
      // We want d=1 (denominator is a perfect square → √den is integer)
      if (denSimp.b !== 1) {
        // Multiply numerator and denominator by √d to rationalize
        // (a√b) / (c√d) = (a√(bd)) / (c*d)
        // But this gets messy. Skip this case unless num and den are small.
        if (denSimp.a === 1 && denSimp.b <= 10) {
          const newNumA = numSimp.a;
          const newNumB = numSimp.b * denSimp.b;
          const newDen = denSimp.a * denSimp.b;
          const newNumSimp = simplifyRadical(newNumB);
          if (newNumSimp) {
            return { neg, numA: newNumA * newNumSimp.a, numB: newNumSimp.b, den: newDen };
          }
        }
        continue;
      }

      // denSimp.b === 1, so √den = c = denSimp.a (integer)
      const c = denSimp.a;
      const numA = numSimp.a;
      const numB = numSimp.b;

      // Simplify fraction: divide gcd from numA and c
      const g2 = gcd(numA, c);
      const finalA = numA / g2;
      const finalDen = c / g2;
      const finalB = numB;

      if (finalB > 1 || finalA > 1) {
        return { neg, numA: finalA, numB: finalB, den: finalDen };
      }
      // finalB == 1 and finalA == 1 → value = 1/den (rational, no radical needed)
      if (finalDen === 1) return null; // value = 1, no radical needed
      return null; // pure rational, don't show radical
    }
  }
  return null;
}

// Known exact trig values for angles that are rational multiples of π
function detectTrigExact(exprStr, ansVal) {
  const s = exprStr.trim();
  const match = s.match(/^(sin|cos|tan)\((.+)\)$/);
  if (!match) return null;
  const fn = match[1];
  const argStr = match[2];

  try {
    const argVal = evaluateExpression(argStr, ansVal);
    if (argVal === null || !Number.isFinite(argVal)) return null;

    // If arg doesn't contain pi, treat as degrees → convert to radians
    const pi = Math.PI;
    const isDegrees = !argStr.includes('pi');
    let angle = isDegrees ? (argVal * pi / 180) : argVal;

    // Normalize angle to [0, 2π)
    angle = angle % (2*pi);
    if (angle < 0) angle += 2*pi;

    // Check if angle/pi is close to a simple fraction
    const frac = angle / pi;
    const knownFractions = [
      [0,1], [1,6], [1,4], [1,3], [1,2], [2,3], [3,4], [5,6],
      [1,1], [7,6], [5,4], [4,3], [3,2], [5,3], [7,4], [11,6]
    ];

    let bestFrac = null, bestErr = 1e-10;
    for (const [num, den] of knownFractions) {
      const f = num / den;
      const err = Math.abs(frac - f);
      if (err < bestErr) { bestErr = err; bestFrac = [num, den]; }
    }
    if (!bestFrac) return null;

    const [n, d] = bestFrac;
    // Map to exact values using quadrant-aware tables
    // Simplify to first quadrant using symmetries
    let qAngle = angle; // already in [0, 2π)
    let signSin = 1, signCos = 1, signTan = 1;

    if (qAngle > pi) { signSin = -1; signCos = -1; }
    if (qAngle > pi/2 && qAngle < 3*pi/2) signCos = -signCos;
    if (qAngle > pi && qAngle < 2*pi) { /* sin already negative */ }

    // Reference angle (first quadrant equivalent)
    let ref = angle % pi;
    if (ref < 0) ref += pi;
    if (ref > pi/2 && ref <= pi) ref = pi - ref;

    // Known exact values for reference angle
    const refFrac = ref / pi;
    let exact = null;

    // [a, b, den]: value = a*√b/den  (all positive, Q1 reference)
    if (Math.abs(refFrac - 0) < 1e-10) exact = { sin: [0,1,1], cos: [1,1,1], tan: [0,1,1] };
    else if (Math.abs(refFrac - 1/6) < 1e-10) exact = { sin: [1,1,2], cos: [1,3,2], tan: [1,3,3] };
    else if (Math.abs(refFrac - 1/4) < 1e-10) exact = { sin: [1,2,2], cos: [1,2,2], tan: [1,1,1] };
    else if (Math.abs(refFrac - 1/3) < 1e-10) exact = { sin: [1,3,2], cos: [1,1,2], tan: [1,3,1] };
    else if (Math.abs(refFrac - 1/2) < 1e-10) exact = { sin: [1,1,1], cos: [0,1,1], tan: [Infinity,1,1] };

    if (!exact) return null;

    // [sign, numA, numB, den]
    // sin ref = sign * (a√b)/c
    const getVal = (entry) => {
      if (!isFinite(entry[0])) return null; // infinity
      return { numA: entry[0], numB: entry[1], den: entry[2] };
    };

    let entry;
    if (fn === 'sin') {
      const e = exact.sin;
      entry = { neg: signSin < 0, numA: e[0], numB: e[1], den: e[2] };
    } else if (fn === 'cos') {
      const e = exact.cos;
      entry = { neg: signCos < 0, numA: e[0], numB: e[1], den: e[2] };
    } else {
      // tan = sin/cos = (s[0]*√s[1]/s[2]) / (c[0]*√c[1]/c[2])
      //     = (s[0]*√(s[1]*c[1])*c[2]) / (s[2]*c[0]*c[1])
      const s = exact.sin;
      const c = exact.cos;
      if (c[0] === 0) return null;
      const tanNeg = (signSin < 0) !== (signCos < 0);
      const numA = s[0] * c[2];
      const numB = s[1] * c[1];
      const denVal = s[2] * c[0] * c[1];
      // Simplify
      const numSimp = simplifyRadical(numB);
      if (numSimp) {
        const g = gcd(numA * numSimp.a, denVal);
        entry = { neg: tanNeg, numA: (numA * numSimp.a) / g, numB: numSimp.b, den: denVal / g };
      } else {
        return null;
      }
    }

    if (entry.numA === 0) return { neg: false, numA: 0, numB: 1, den: 1 };
    if (!isFinite(entry.den) || entry.den === 0) return null;

    return {
      neg: entry.neg,
      numA: entry.numA,
      numB: entry.numB,
      den: entry.den,
      value: (entry.neg ? -1 : 1) * (entry.numA * Math.sqrt(entry.numB)) / entry.den
    };
  } catch(e) { return null; }
}

function tryFormatRadical(exprStr, ansVal) {
  // 1. Try sqrt() expressions
  const s = exprStr.trim();
  const isNegSqrt = isSimpleNegSqrt(s);
  const isPosSqrt = isSimpleSqrt(s);
  if (isPosSqrt || isNegSqrt) {
    try {
      const { neg, arg } = extractSqrtArg(s);
      const argVal = evaluateExpression(arg, ansVal);
      if (argVal !== null && Number.isFinite(argVal)) {
        const rounded = Math.round(argVal);
        if (isCloseToInteger(argVal) && rounded > 0) {
          const simp = simplifyRadical(rounded);
          if (simp) {
            return {
              neg: neg || isNegSqrt, numA: simp.a, numB: simp.b, den: 1,
              value: (neg||isNegSqrt ? -1 : 1) * Math.sqrt(argVal)
            };
          }
        }
      }
    } catch(e) {}
  }

  // 2. Try trig exact values
  const trig = detectTrigExact(s, ansVal);
  if (trig) return trig;

  // 3. General radical detection for numeric results
  try {
    const val = evaluateExpression(s, ansVal);
    if (val !== null && Number.isFinite(val) && val !== 0) {
      const radical = detectGeneralRadical(val);
      if (radical) {
        radical.value = val;
        return radical;
      }
      // 4. Rational fraction detection
      const frac = detectFraction(val);
      if (frac && frac.den > 1) {
        return { neg: frac.num < 0, numA: Math.abs(frac.num), numB: 1, den: frac.den, value: val };
      }
    }
  } catch(e) {}

  return null;
}

function detectFraction(value) {
  if (!Number.isFinite(value) || value === 0) return null;
  const neg = value < 0;
  const absV = Math.abs(value);
  // Search for simple rational representation
  for (let den = 1; den <= 1000; den++) {
    const num = absV * den;
    const numR = Math.round(num);
    if (Math.abs(num - numR) < 1e-10) {
      const g = gcd(Math.abs(numR), den);
      return { num: (neg ? -1 : 1) * (numR / g), den: den / g };
    }
  }
  return null;
}

// ======================== LATEX DISPLAY ENGINE ========================

function exprToLatex(raw) {
  if (!raw) return '';
  let s = raw;

  // Convert sqrt(…) → \sqrt{…}  (handles nested parens)
  s = convertSqrt(s);

  // Convert function names
  const funcs = ['sin','cos','tan','log','ln','exp','abs','asin','acos','atan'];
  for (const f of funcs) {
    const re = new RegExp('\\b' + f + '\\b', 'g');
    s = s.replace(re, f === 'abs' ? '\\operatorname{abs}' : '\\' + f);
  }

  // Convert ^(expr) → ^{expr}  (handles nesting via iteration)
  let prev2 = '';
  while (prev2 !== s) {
    prev2 = s;
    s = s.replace(/\^\(([^()]*)\)/g, '^{$1}');
  }

  // Convert ^number or ^-number → ^{number}
  s = s.replace(/\^(\-?\d+(?:\.\d+)?)/g, '^{$1}');
  // Convert ^variable → ^{variable}
  s = s.replace(/\^([a-zA-Z]\w*)/g, '^{$1}');

  // Convert constants
  s = s.replace(/\bpi\b/g, '\\pi');
  s = s.replace(/\bans\b/g, '\\text{ANS}');
  s = s.replace(/\be\b(?![a-zA-Z])/g, 'e');

  // Convert operators
  s = s.replace(/\*/g, '\\times ');
  s = s.replace(/\//g, '\\div ');
  s = s.replace(/−/g, '-');
  // Escape % for LaTeX (comment char) — show as \%
  s = s.replace(/%/g, '\\%');

  return s;
}

function convertSqrt(s) {
  // Repeatedly replace innermost sqrt(no_parens_inside) with \sqrt{...}
  // This naturally handles nesting and properly removes the closing )
  let prev = '';
  while (prev !== s) {
    prev = s;
    s = s.replace(/sqrt\(([^()]*)\)/g, '\\sqrt{$1}');
  }
  return s;
}

function renderLatex(latex) {
  try {
    return katex.renderToString(latex, {
      throwOnError: true,
      trust: true,
      strict: false
    });
  } catch (e) {
    return null;
  }
}

function numberToLatex(n) {
  if (n === null || n === undefined) return '0';
  if (!isFinite(n)) {
    if (isNaN(n)) return '\\text{错误}';
    return n > 0 ? '\\infty' : '-\\infty';
  }
  if (n === 0) return '0';
  const absN = Math.abs(n);
  const neg = n < 0;
  if (absN >= 1e12 || (absN < 1e-5 && absN > 0)) {
    const exp = Math.floor(Math.log10(absN));
    const mantissa = absN / Math.pow(10, exp);
    let mStr = parseFloat(mantissa.toPrecision(12));
    if (Number.isInteger(mStr) && Math.abs(mStr) < 1e15) mStr = mStr.toString();
    else mStr = parseFloat(mStr.toFixed(10)).toString();
    const absM = Math.abs(parseFloat(mStr));
    const mFinal = absM === 1 ? '1' : (absM % 1 === 0 ? String(absM) : parseFloat(absM.toFixed(10)).toString());
    return (neg ? '-' : '') + mFinal + ' \\times 10^{' + exp + '}';
  }
  if (Number.isInteger(n) && Math.abs(n) < 1e15) return n.toString();
  let str = parseFloat(absN.toPrecision(12)).toString();
  if (str.includes('.')) str = str.replace(/0+$/, '').replace(/\.$/, '');
  return str === '' ? '0' : (neg ? '-' : '') + str;
}

function renderResult(r) {
  const latex = numberToLatex(r);
  const rendered = renderLatex(latex);
  return rendered || formatResult(r);
}

function formatExprForDisplay(raw) {
  if (!raw) return '';
  const latex = exprToLatex(raw);
  const rendered = renderLatex(latex);
  if (rendered) return rendered;

  // Fallback: plain text with unicode formatting
  let d = raw
    .replace(/\*/g, '×')
    .replace(/\//g, '÷')
    .replace(/-/g, '−')
    .replace(/\bans\b/g, 'ANS');
  d = d.replace(/\^(\-?\d+)/g, (_, exp) => toSup(parseInt(exp)));
  return d;
}

// ======================== HISTORY ========================
const HIST_KEY = 'scicalc_history_v2';
function loadHistory() { try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch { return []; } }
function saveHistory(h) { localStorage.setItem(HIST_KEY, JSON.stringify(h)); }
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderHistory() {
  const h = loadHistory();
  if (h.length === 0) { histList.innerHTML = '<div class="hist-empty">暂无记录</div>'; return; }
  histList.innerHTML = h.slice().reverse().map((e, i) => {
    const idx = h.length - 1 - i;
    let resHtml;
    if (e.radicalDisplay) {
      const rd = e.radicalDisplay;
      const latex = radicalFracToLatex(rd.neg, rd.numA, rd.numB, rd.den);
      const rendered = renderLatex(latex);
      resHtml = rendered || escapeHtml(e.displayResult || formatResult(e.result));
    } else {
      resHtml = escapeHtml(e.displayResult || formatResult(e.result));
    }
    return '<div class="hist-item" data-idx="'+idx+'"><div class="hist-item-expr">'+escapeHtml(e.displayExprRaw||e.expr)+'</div><div class="hist-item-res">'+resHtml+'</div><button class="hist-item-del" data-del="'+idx+'" title="删除">×</button></div>';
  }).join('');
}

function addHistory(expr, displayExprRaw, result, radicalDisplay) {
  const h = loadHistory();
  h.push({ expr, displayExprRaw, result, radicalDisplay: radicalDisplay || null, displayResult: formatResult(result), time: Date.now() });
  if (h.length > 100) h.shift();
  saveHistory(h);
  renderHistory();
}

    let previewExpr = calcState.expr;
    if (calcState.fracActive) {
      const num = calcState.fracNum || '0';
      const den = calcState.fracDen || '1';
      previewExpr = calcState.fracPrefix + '((' + num + ')/(' + den + '))' + calcState.expr;
    }
    // Live preview: check for radical too
    const radical = tryFormatRadical(previewExpr, calcState.ans);
    if (radical) {
      const latex = radicalFracToLatex(radical.neg, radical.numA, radical.numB, radical.den);
      const rendered = renderLatex(latex);
      resultLine.innerHTML = rendered || renderResult(radical.value);
    } else {
      try {
        const r = evaluateExpression(previewExpr, calcState.ans);
        if (r !== null) resultLine.innerHTML = renderResult(r);
      } catch (e) { resultLine.innerHTML = ''; }
    }
  } else if (calcState.result !== null) {
    resultLine.innerHTML = renderResult(calcState.result);
  } else {
    resultLine.innerHTML = renderResult(0);
  }
}

// ======================== INPUT HANDLING ========================
function clearCalc() {
  calcState = { expr:'', displayExpr:'', result:null, ans:calcState.ans, fresh:true, openParens:0, radicalDisplay:null, fracActive:false, fracNum:'', fracDen:'', fracSlot:0, fracPrefix:'' };
  updateDisplay();
}

function backspace() {
  if (!calcState.fresh) { clearCalc(); return; }
  if (calcState.fracActive) {
    if (calcState.fracSlot === 0 && calcState.fracNum.length > 0) {
      calcState.fracNum = calcState.fracNum.slice(0, -1);
    } else if (calcState.fracSlot === 1 && calcState.fracDen.length > 0) {
      calcState.fracDen = calcState.fracDen.slice(0, -1);
    }
    updateDisplay();
    return;
  }
  if (!calcState.expr) return;
  const last = calcState.expr[calcState.expr.length-1];
  if (last === '(') calcState.openParens = Math.max(0, calcState.openParens-1);
  if (last === ')') calcState.openParens++;
  const fnMatch = calcState.expr.match(/(sin|cos|tan|log|ln|exp|sqrt|abs|asin|acos|atan)\($/);
  if (fnMatch) {
    const len = fnMatch[0].length;
    calcState.expr = calcState.expr.substring(0, calcState.expr.length - len);
    calcState.displayExpr = calcState.displayExpr.substring(0, calcState.displayExpr.length - len);
    calcState.openParens = Math.max(0, calcState.openParens-1);
  } else {
    calcState.expr = calcState.expr.slice(0, -1);
    calcState.displayExpr = calcState.displayExpr.slice(0, -1);
  }
  calcState.result = null;
  updateDisplay();
}

function insertText(text, displayText) {
  if (calcState.fracActive) {
    const isOp = ['+','-','*','/','^'].includes(text);
    if (isOp) {
      // Exit fraction mode and place operator after fraction
      const num = calcState.fracNum || '0';
      const den = calcState.fracDen || '1';
      const fracExpr = (calcState.fracPrefix ? calcState.fracPrefix : '') + '((' + num + ')/(' + den + '))';
      calcState.expr = fracExpr + text + calcState.expr;
      calcState.displayExpr = fracExpr + (displayText||text) + calcState.displayExpr;
      calcState.fracActive = false;
      calcState.result = null; calcState.fresh = true;
      updateDisplay();
      return;
    }
    if (calcState.fracSlot === 0) calcState.fracNum += text;
    else if (calcState.fracSlot === 1) calcState.fracDen += text;
    else { calcState.fracActive = false; calcState.expr += text; calcState.displayExpr += displayText||text; }
    calcState.result = null;
    updateDisplay();
    return;
  }
  if (!calcState.fresh) {
    const ops = ['+','-','*','/','^'];
    if (ops.includes(text) && calcState.result !== null) {
      calcState.expr = formatResult(calcState.result) + text;
      calcState.displayExpr = formatResult(calcState.result) + (displayText||text);
      calcState.ans = calcState.result;
    } else {
      calcState.expr = text;
      calcState.displayExpr = displayText || text;
    }
    calcState.result = null;
    calcState.fresh = true;
  } else {
    calcState.expr += text;
    calcState.displayExpr += displayText || text;
    calcState.result = null;
  }
  updateDisplay();
}

// ======================== KEYPAD EVENTS ========================
keypad.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn || !btn.dataset.action) return;
  const action = btn.dataset.action;

  switch (action) {
    case 'digit': insertText(btn.dataset.value); break;
    case 'decimal': insertText('.'); break;
    case 'operator': insertText(btn.dataset.value, btn.textContent.trim()); break;
    case 'paren':
      if (btn.dataset.value === '(') { calcState.openParens++; insertText('('); }
      else if (calcState.openParens > 0) { calcState.openParens--; insertText(')'); }
      break;
    case 'function': {
      const fn = btn.dataset.value;
      if (['sin','cos','tan','log','ln','exp','sqrt','abs','asin','acos','atan'].includes(fn)) {
        calcState.openParens++;
        insertText(fn+'(', fn+'(');
      } else if (fn === 'square') { insertText('^2', '²'); }
      else if (fn === 'power') { insertText('^'); }
      else if (fn === 'tenpow') { insertText('10^'); }
      else if (fn === 'reciprocal') { insertText('^(-1)', '⁻¹'); }
      break;
    }
    case 'constant':
      insertText(btn.dataset.value==='pi'?'pi':'e', btn.dataset.value==='pi'?'π':'e');
      break;
    case 'percent': insertText('%'); break;
    case 'fraction':
      if (!calcState.fresh && calcState.result !== null) {
        // Start fraction from result
        calcState.fracPrefix = formatResult(calcState.result);
      } else {
        calcState.fracPrefix = calcState.expr;
      }
      calcState.fracActive = true; calcState.fracSlot = 0;
      calcState.fracNum = ''; calcState.fracDen = '';
      calcState.expr = ''; calcState.displayExpr = '';
      calcState.result = null; calcState.fresh = true;
      updateDisplay(); break;
    case 'arrow':
      if (calcState.fracActive) {
        if (btn.dataset.value === 'right') {
          if (calcState.fracSlot === 0) calcState.fracSlot = 1;
          else if (calcState.fracSlot === 1) calcState.fracSlot = 2;
          else { calcState.fracActive = false; }
        } else {
          if (calcState.fracSlot === 2) calcState.fracSlot = 1;
          else if (calcState.fracSlot === 1) calcState.fracSlot = 0;
        }
        updateDisplay();
      }
      break;
    case 'negate':
      if (!calcState.fresh && calcState.result !== null) {
        calcState.result = -calcState.result;
        calcState.radicalDisplay = null;
        calcState.expr = formatResult(calcState.result);
        calcState.displayExpr = calcState.expr;
        calcState.fresh = false;
      } else if (calcState.expr) {
        if (calcState.expr.startsWith('-')) {
          calcState.expr = calcState.expr.slice(1);
          calcState.displayExpr = calcState.displayExpr.slice(1);
        } else {
          calcState.expr = '-' + calcState.expr;
          calcState.displayExpr = '−' + calcState.displayExpr;
        }
      } else {
        // Expression empty: start with a negative sign
        calcState.expr = '-';
        calcState.displayExpr = '−';
        calcState.fresh = true;
      }
      updateDisplay(); break;
    case 'ans': insertText('ans', 'ANS'); break;
    case 'clear': clearCalc(); break;
    case 'backspace': backspace(); break;
    case 'equals': {
      // Build full expression from fraction parts if active
      let exprToEval, displayExprRaw;
      if (calcState.fracActive) {
        const num = calcState.fracNum || '0';
        const den = calcState.fracDen || '1';
        exprToEval = calcState.fracPrefix + '((' + num + ')/(' + den + '))' + calcState.expr;
        displayExprRaw = calcState.fracPrefix + num + '/' + den + calcState.displayExpr;
        calcState.fracActive = false;
      } else {
        exprToEval = calcState.expr;
        displayExprRaw = calcState.displayExpr || calcState.expr;
      }
      if (!exprToEval && calcState.result === null) break;
      if (!exprToEval && calcState.result !== null) { updateDisplay(); break; }
      try {
        const r = evaluateExpression(exprToEval, calcState.ans);
        const radical = tryFormatRadical(exprToEval, calcState.ans);
        if (radical) {
          calcState.radicalDisplay = radical;
          calcState.result = radical.value;
        } else {
          calcState.radicalDisplay = null;
          calcState.result = r;
        }
        calcState.ans = r; calcState.fresh = false;
        addHistory(exprToEval, displayExprRaw, r, calcState.radicalDisplay);
        calcState.expr = ''; calcState.displayExpr = ''; calcState.openParens = 0;
      } catch (e) {
        resultLine.innerHTML = renderResult(NaN);
        calcState.fresh = false; calcState.expr = ''; calcState.displayExpr = '';
        calcState.radicalDisplay = null;
      }
      updateDisplay(); break;
    }
  }
});

// ======================== KEYBOARD ========================
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key;
  if (/\d/.test(k)) { insertText(k); return; }
  if (k === '.') { insertText('.'); return; }
  if (k === '+') { insertText('+'); return; }
  if (k === '-') { insertText('-', '−'); return; }
  if (k === '*') { insertText('*', '×'); return; }
  if (k === '/') { insertText('/', '÷'); return; }
  if (k === '^') { insertText('^'); return; }
  if (k === '%') { insertText('%'); return; }
  if (k === '(') { calcState.openParens++; insertText('('); return; }
  if (k === ')') { if (calcState.openParens>0){calcState.openParens--;insertText(')');} return; }
  if (k === 'Enter' || k === '=') { e.preventDefault(); keypad.querySelector('[data-action="equals"]').click(); return; }
  if (k === 'Backspace') { backspace(); return; }
  if (k === 'Escape' || k === 'Delete') { clearCalc(); return; }
});

// ======================== HISTORY PANEL ========================
let historyOpen = true;
histList.addEventListener('click', e => {
  const delBtn = e.target.closest('[data-del]');
  if (delBtn) {
    e.stopPropagation();
    const h = loadHistory(); h.splice(parseInt(delBtn.dataset.del), 1);
    saveHistory(h); renderHistory(); return;
  }
  const item = e.target.closest('.hist-item');
  if (item) {
    const h = loadHistory(); const entry = h[parseInt(item.dataset.idx)];
    if (entry) {
      calcState = { expr:entry.expr, displayExpr:entry.displayExprRaw||entry.expr, result:entry.result, ans:entry.result, fresh:false, openParens:0, radicalDisplay:entry.radicalDisplay||null };
      updateDisplay();
    }
  }
});

$('#btnHistory').addEventListener('click', () => {
  historyOpen = !historyOpen;
  historyPanel.classList.toggle('hidden', !historyOpen);
});

$('#histClear').addEventListener('click', () => { saveHistory([]); renderHistory(); });

// ======================== THEME ========================
function getSystemTheme() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('scicalc_theme', t);
}
$('#btnTheme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || getSystemTheme();
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});

const saved = localStorage.getItem('scicalc_theme');
if (saved) applyTheme(saved);
else document.documentElement.removeAttribute('data-theme');
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!localStorage.getItem('scicalc_theme')) document.documentElement.removeAttribute('data-theme');
});

// ======================== RESPONSIVE HISTORY ========================
const mq = window.matchMedia('(max-width: 700px)');
function handleMQ(e) {
  if (e.matches) { historyOpen = false; historyPanel.classList.add('hidden'); }
  else { historyOpen = true; historyPanel.classList.remove('hidden'); }
}
mq.addEventListener('change', handleMQ);
handleMQ(mq);

// ======================== INIT ========================
renderHistory();
updateDisplay();
})();
</script>

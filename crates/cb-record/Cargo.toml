[package]
name = "cb-record"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Screen recording core: frame pacing, scaling, audio capture and mixing; encoders are supplied by the platform"

[dependencies]
log.workspace = true

[features]
default = []
# Microphone / loopback capture through cpal (enabled by the platform crates).
capture = ["dep:cpal"]

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = { version = "0.15", optional = true }

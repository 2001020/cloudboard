[package]
name = "cb-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cb-core.workspace = true
cb-ui.workspace = true
cb-render.workspace = true
log.workspace = true
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }

# Linux is only a development target (CI tests); Wayland keeps it free of
# native build dependencies.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }
softbuffer = { version = "0.4", default-features = false, features = ["wayland", "wayland-dlopen"] }

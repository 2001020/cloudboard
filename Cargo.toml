[workspace]
resolver = "2"
members = [
    "crates/cb-core",
    "crates/cb-render",
    "crates/cb-pdf",
    "crates/cb-update",
    "crates/cb-remote",
    "crates/cb-ui",
]

[workspace.package]
version = "27.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/2001020/cloudboard"
rust-version = "1.80"

[workspace.dependencies]
cb-core = { path = "crates/cb-core" }
cb-render = { path = "crates/cb-render" }
cb-pdf = { path = "crates/cb-pdf" }
cb-ui = { path = "crates/cb-ui" }
cb-update = { path = "crates/cb-update" }
cb-remote = { path = "crates/cb-remote" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
crc32fast = "1"
png = "0.17"
tiny-skia = "0.11"
cosmic-text = "0.12"
crossbeam-channel = "0.5"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
base64 = "0.22"
rand = "0.8"
dirs = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
